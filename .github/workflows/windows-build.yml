name: Windows x64 installer

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main, 'task/sol-voice-smart-switching']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      # windows-2022 includes Visual Studio C++ tools and the Windows SDK.
      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Python for deterministic SOL packaging
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test SOL packaging tooling
        run: python -m unittest discover -s tests -p test_sol_packaging.py -v

      - name: Stage verified offline Vosk, Russian model and Russian eSpeak NG
        run: python scripts/prepare_sol.py

      - name: Test command routing and settings
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust validation and window lifecycle
        run: cargo test --locked --manifest-path tests/rust-validation/Cargo.toml

      - name: Check Windows dev configuration
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      # No release/tag inputs: build only, then upload an Actions artifact.
      # Tauri runs the existing beforeBuildCommand (TypeScript + Vite).
      - name: Build Windows x64 with official Tauri action
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0 (v0.6.2)
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.bundle.conf.json --target x86_64-pc-windows-msvc --bundles nsis --ci -- --locked

      - name: Smoke test native release close and reopen
        shell: pwsh
        run: ./tests/windows-reopen.ps1 -Exe ./src-tauri/target/x86_64-pc-windows-msvc/release/assistent1.exe

      - name: Build native installed-bundle checker
        run: cargo build --locked --manifest-path tests/rust-validation/Cargo.toml --bin sol-bundle-check

      - name: Verify installed SOL DLL, Russian model, TTS and reopen
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          ./tests/windows-installer.ps1 -Installer $installers[0].FullName -BundleChecker ./tests/rust-validation/target/debug/sol-bundle-check.exe
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination artifacts/Assistent1.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Assistent1-windows-x64-SOL
          path: artifacts/Assistent1.exe
          if-no-files-found: error
          retention-days: 14
